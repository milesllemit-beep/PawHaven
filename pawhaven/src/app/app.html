<div class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-4 px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2 text-lg font-bold text-emerald-700">
        <span class="text-2xl">🐾</span> PawHaven
      </a>

      <div class="flex flex-1 flex-wrap items-center gap-1">
        <a
          routerLink="/animals"
          routerLinkActive="text-emerald-700"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Adopt
        </a>
        <a
          routerLink="/reports"
          routerLinkActive="text-emerald-700"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Stray reports
        </a>
        @if (auth.isAuthenticated()) {
          <a
            routerLink="/applications"
            routerLinkActive="text-emerald-700"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >
            My applications
          </a>
        }
        @if (auth.isAdmin()) {
          <a
            routerLink="/admin"
            routerLinkActive="text-emerald-700"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >
            Admin
          </a>
        }
      </div>

      <div class="flex items-center gap-3">
        @if (auth.isAuthenticated()) {
          <span class="text-sm text-slate-500">{{ auth.user()?.name }}</span>
          <button
            type="button"
            class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
            (click)="logout()"
          >
            Logout
          </button>
        } @else {
          <a
            routerLink="/login"
            class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
          >
            Login
          </a>
          <a
            routerLink="/register"
            class="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-emerald-700"
          >
            Register
          </a>
        }
      </div>
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
